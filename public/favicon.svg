<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="finGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle with subtle border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#06b6d4" stroke-width="2.5" stroke-opacity="0.8" />

  <!-- Graduation Cap Top (FinPath High School) -->
  <path d="M32 14 L52 24 L32 34 L12 24 Z" fill="url(#finGrad)" />

  <!-- Cap base / skull cap -->
  <path d="M20 29.5 L20 38 C20 44 44 44 44 38 L44 29.5" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />

  <!-- Tassel dangling on right -->
  <path d="M47 26.5 L51 35 L49 39" fill="none" stroke="#facc15" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="49" cy="40" r="1.5" fill="#facc15" />

  <!-- Financial Upward Pathway / Growth Arrow -->
  <path d="M22 49 L30 43 L36 47 L46 37" fill="none" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M40 37 L46 37 L46 43" fill="none" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
